<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Labels</title>
</head>
<body>
    <form action="/action">
        <input type="checkbox" name="age" id="age">
        <label for="age">I am above 18 years of age</label>
        <button type="submit">Submit</button>
    </form>


</body>
</html>
