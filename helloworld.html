<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>
</head>
<body>
    <table border="black">
        <caption>FOOD MENU</caption>

        <tr>
            <th>ITEM</th>
            <th>PRICE</th>
        </tr>
        <tr>
            <td>Pizza</td>
            <td>$10</td>
        </tr>
        <tr>
            <td>Burger</td>
            <td>$5</td>
        </tr>
        <tr>
            <td>Pasta</td>
            <td>$8</td>
        </tr>
    </table>

</body>
</html>
