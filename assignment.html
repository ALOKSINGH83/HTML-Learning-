<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
</head>
<body>
    <form action="/action">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
        </div><br>
        <div>
            Sex:
            <input type="radio" name="gender" id="m" value="m">
            <label for="m">Male</label>
            <input type="radio" name="gender" id="f" value="f">
            <label for="f">Female</label>
        </div><br>
        <div>
            <label for="country">Country
                <select id="country" name="country">
                    <option value="ind">India</option>
                    <option value="can">Canada</option>
                    <option value="usa">USA</option>
                    <option value="frn">France</option>
                    <option value="itl">Italy</option>
                    <option value="select" selected>Select an option</option>
                </select>
            </label>
        </div><br>
        <div>
            <label for="mess">Message:</label><br>
            <textarea id="mess" name="mess"></textarea>
        </div><br>
        <div>
            <input type="checkbox" id="subs" name="subs">
            <label for="subs">Subscribe?</label>
        </div><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
