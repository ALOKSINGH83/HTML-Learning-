<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
</head>
<body>
    <h1><b>Feedback Form</b></h1>
    <form action="/action">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Write your name">
        </div><br>
        <div>
            <label for="mail">Email:</label>
            <input type="text" id="mail" name="mail" placeholder="Write your Email">
        </div><br>
        <div>
            <label for="mess">Message:</label><br>
            <textarea id="mess" name="mess"></textarea>
        </div><br>
        <div>
            Rate us out of 5:<br>
            <label for="1">1</label>
                <input type="radio" id="1" name="rate" value="1"><br>
            <label for="2">2</label>
                <input type="radio" id="2" name="rate" value="2"><br>
            <label for="3">3</label>
                <input type="radio" id="3" name="rate" value="3"><br>
            <label for="4">4</label>
                <input type="radio" id="4" name="rate" value="4"><br>
            <label for="5">5</label>
                <input type="radio" id="5" name="rate" value="5">
        </div><br>

        <button type="submit">Send your message</button>
    </form>
</body>
</html>
